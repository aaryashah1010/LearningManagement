services:
  mysql:
    image: mysql:8.4
    container_name: lm-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3308:3306"
    volumes:
      - lm_mysql_data:/var/lib/mysql
      - ./app/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
      - ./app/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: lm-backend
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/app/app:z
    command: ["uv", "run", "--no-dev", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  lm_mysql_data:
